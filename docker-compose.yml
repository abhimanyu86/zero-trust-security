services:
  gateway:
    build: .
    command: python -m sensetrust.server --data /data --host 0.0.0.0 --port 8443
    ports: ["8443:8443"]
    volumes: ["gateway-data:/data"]
  dashboard:
    build: .
    command: streamlit run dashboard/app.py --server.address 0.0.0.0 --server.port 8501
    ports: ["8501:8501"]
volumes:
  gateway-data:
