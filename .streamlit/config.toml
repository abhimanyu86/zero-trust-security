# Run without interactive prompts (older Streamlit versions asked for an email on first
# run and waited) and without usage stats. The launchers open the browser themselves.
[server]
headless = true
port = 8501

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"

# YellowSense look: white and yellow, quiet when normal.
[theme]
base = "light"
primaryColor = "#F9A825"
backgroundColor = "#FFFDF7"
secondaryBackgroundColor = "#FFF9E6"
textColor = "#2B2B2B"
